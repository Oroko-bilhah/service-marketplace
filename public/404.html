<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <script>
      const path = window.location.pathname

      if (path.startsWith("/service-marketplace/")) {
        sessionStorage.redirect = path + window.location.search + window.location.hash
        window.location.replace("/service-marketplace/")
      }
    </script>
  </head>

  <body></body>
</html>
