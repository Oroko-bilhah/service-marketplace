<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <script>
      const path = window.location.pathname
      const base = "/service-marketplace"

      if (path.startsWith(base + "/") || path === base) {
        sessionStorage.redirect = path + window.location.search + window.location.hash
        window.location.replace(base + "/")
      }
    </script>
  </head>

  <body></body>
</html>
